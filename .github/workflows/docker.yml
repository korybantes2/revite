name: Docker

on:
  push:
    branches:
      - "master"
    tags:
      - "*"
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/docker.yml"
      - "!.github/workflows/preview_*.yml"
      - ".vscode/**"
      - ".gitignore"
      - ".gitlab-ci.yml"
      - "LICENSE"
      - "README"
  pull_request:
    branches:
      - "master"
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/docker.yml"
      - "!.github/workflows/preview_*.yml"
      - ".vscode/**"
      - ".gitignore"
      - ".gitlab-ci.yml"
      - "LICENSE"
      - "README"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [linux/amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: "recursive"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache/${{ matrix.architecture }}
          key: ${{ runner.os }}-buildx-${{ matrix.architecture }}-${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: ${{ matrix.architecture }}
          cache-from: type=local,src=/tmp/.buildx-cache/${{ matrix.architecture }}
          cache-to: type=local,dest=/tmp/.buildx-cache-new/${{ matrix.architecture }},mode=max
          tags: gangio/client:latest
          outputs: type=docker

      - name: Move cache
        run: |
          mkdir -p /tmp/.buildx-cache/linux
          rm -rf /tmp/.buildx-cache/linux/amd64
          if [ -d /tmp/.buildx-cache-new/linux/amd64 ]; then
            mv /tmp/.buildx-cache-new/linux/amd64 /tmp/.buildx-cache/linux/amd64
          else
            echo "No new cache available for linux/amd64."
          fi

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: "recursive"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache/linux/amd64
          key: ${{ runner.os }}-buildx-linux/amd64-${{ github.sha }}

      - name: Build Docker image for export
        run: |
          docker build -t gangio/client:latest .

      - name: Save Docker image to archive
        run: |
          docker save gangio/client:latest -o client.tar

      - name: Upload TAR to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "client.tar"
          target: "/home/${{ secrets.VPS_USER }}/"

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            docker load -i ~/client.tar
            docker stop gangio-client || true
            docker rm gangio-client || true
            docker run -d --name gangio-client -p 3000:3000 gangio/client:latest

      - name: Move cache
        run: |
          mkdir -p /tmp/.buildx-cache/linux
          rm -rf /tmp/.buildx-cache/linux/amd64
          if [ -d /tmp/.buildx-cache-new/linux/amd64 ]; then
            mv /tmp/.buildx-cache-new/linux/amd64 /tmp/.buildx-cache/linux/amd64
          else
            echo "No new cache available for linux/amd64."
          fi
